<!DOCTYPE html><html lang="en"><head>


<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>(function(){try{if(localStorage.getItem('gk-theme')!=='light')document.documentElement.setAttribute('data-theme','dark')}catch(e){document.documentElement.setAttribute('data-theme','dark')}})();</script>
<link rel="icon" type="image/png" sizes="512x512" href="/logo-mark-512.png">
<link rel="icon" type="image/png" sizes="256x256" href="/logo-mark-256.png">
<link rel="icon" type="image/png" sizes="64x64" href="/logo-mark-64.png">
<link rel="apple-touch-icon" sizes="512x512" href="/logo-mark-512.png">
<title>Log in — GrowthKit AI</title>
<meta name="description" content="Log in to GrowthKit AI.">
<meta name="theme-color" content="#1F4732">
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://growthkitai.com/login">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FAF8F4; --bg-2: #F2EFE8; --ink: #14130F; --ink-2: #2A2823; --muted: #6B6760;
    --line: #E2DDD3; --line-2: #D4CEC1; --accent: #1F4732; --accent-soft: #2E6249; --paper: #FFFFFF;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  html { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  body { background: var(--bg); color: var(--ink); font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 16px; line-height: 1.55; font-feature-settings: "ss01","cv11"; overflow-x: hidden; }
  a { color: inherit; text-decoration: none; }
  ::selection { background: var(--accent); color: var(--bg); }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 32px; }
  @media (max-width: 720px) { .wrap { padding: 0 22px; } }
  .auth-top, .auth-wrap { position: relative; z-index: 1; }
</style>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="auth.css">
<script src="theme.js" defer></script>
</head>
<body class="auth-body" data-auth-page="login">

<div class="dk-grid" aria-hidden="true"></div>
<div class="dk-scan" aria-hidden="true"></div>

<header class="auth-top">
  <div class="wrap auth-top-inner">
    <a href="/" class="auth-brand">
      <span class="logo-mark" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 80 80">
          <rect width="80" height="80" rx="14" fill="#1F4732"/>
          <g stroke="#FAF8F4" stroke-width="4" fill="none" stroke-linecap="square"><path d="M12 22 V12 H22"/><path d="M58 12 H68 V22"/><path d="M68 58 V68 H58"/><path d="M22 68 H12 V58"/></g>
          <text x="40" y="58" text-anchor="middle" font-family="Instrument Serif, Times New Roman, serif" font-style="italic" font-size="56" fill="#FAF8F4">G</text>
          <rect x="58" y="60" width="8" height="8" fill="#B7E4CC"/>
        </svg>
      </span>
      <span>GrowthKit AI</span>
    </a>
    <div class="auth-top-end">
      <a href="/" class="back"><span class="arr">←</span> Back to site</a>
      <button class="theme-toggle" type="button" aria-label="Switch theme" aria-pressed="false">
        <svg class="theme-icon icon-sun" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 3v1.5"/><path d="M12 19.5V21"/><path d="M3 12h1.5"/><path d="M19.5 12H21"/><path d="m5.6 5.6 1.06 1.06"/><path d="m17.34 17.34 1.06 1.06"/><path d="m5.6 18.4 1.06-1.06"/><path d="m17.34 6.66 1.06-1.06"/></svg>
        <svg class="theme-icon icon-moon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </div>
</header>

<main class="auth-wrap">
  <div class="auth-card">
    <div class="auth-eyebrow"><span class="num">/</span>Log in</div>
    <h1>Welcome <em>back</em>.</h1>
    <p class="auth-sub">New here? <a href="/signup">Create an account</a>.</p>

    <div class="auth-alert" data-auth-alert role="alert" aria-live="polite"></div>

    <button class="auth-google" data-auth-oauth="google" type="button">
      <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.5-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 16 19 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.5 0 10.5-2.1 14.3-5.5l-6.6-5.6C29.6 34.5 26.9 35.5 24 35.5c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.6 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.3 5.6l6.6 5.6C41.9 36 44 30.6 44 24c0-1.3-.1-2.5-.4-3.5z"/></svg>
      Continue with Google
    </button>
    <button class="auth-google" data-auth-oauth="github" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M12 .5C5.73.5.5 5.73.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56 0-.28-.01-1.02-.02-2-3.2.7-3.88-1.54-3.88-1.54-.53-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.71.08-.71 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.71 1.26 3.37.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.29 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11.1 11.1 0 0 1 2.9-.39c.98 0 1.97.13 2.9.39 2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.8 1.19 1.83 1.19 3.09 0 4.42-2.69 5.39-5.25 5.68.41.36.78 1.06.78 2.14 0 1.55-.01 2.8-.01 3.18 0 .31.21.68.8.56A10.52 10.52 0 0 0 23.5 12C23.5 5.73 18.27.5 12 .5z"/></svg>
      Continue with GitHub
    </button>

    <div class="auth-divider"><span>or</span></div>

    <form data-auth-form novalidate>
      <div class="auth-field-group">
        <label class="auth-label" for="email">Email</label>
        <input class="auth-input" id="email" name="email" type="email" autocomplete="email" required placeholder="you@company.com">
      </div>
      <div class="auth-field-group">
        <label class="auth-label" for="password">Password</label>
        <input class="auth-input" id="password" name="password" type="password" autocomplete="current-password" required placeholder="••••••••">
      </div>
      <div class="auth-row">
        <label class="auth-check"><input type="checkbox" data-auth-remember checked> Remember me</label>
        <a class="link" href="/reset">Forgot password?</a>
      </div>
      <button class="auth-submit" type="submit">Log in →</button>
    </form>

    <p class="auth-fine">By continuing you agree to our <a href="/terms">Terms</a> &amp; <a href="/privacy">Privacy</a>.</p>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth-config.js"></script>
<script src="auth.js"></script>
<script defer src="/_vercel/insights/script.js"></script>
</body></html>
