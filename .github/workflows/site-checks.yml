# GrowthKit AI — site guard rails.
# Job 1 runs scripts/check-site.mjs (cross-page consistency: placeholder links,
# sitemap↔vercel.json parity, SEO heads, footer sync, logo.html isolation,
# internal links, SCRIPT_URL sync).
# Job 2 runs the unit tests — access control, beta grants, report allowances,
# findings. These are the rules that decide who gets paid product for free, so
# a silent regression there is the most expensive kind this repo can ship.
# Job 3 runs lychee against external URLs only (jsDelivr pins, Google Fonts,
# LinkedIn, Apps Script) — internal links are already covered by job 1.
# The weekly cron catches external links that die between pushes.
#
# Note: Vercel deploys on push regardless of CI — a red ✗ here doesn't block
# the deploy, it tells you the deploy shipped with a consistency problem.

name: Site checks

on:
  push:
  pull_request:
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC
  workflow_dispatch:

jobs:
  consistency:
    name: Cross-page consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/check-site.mjs

  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # `npm ci` needs the lockfile only; the single dependency (stripe) is
      # required by lib/subscriptions.js, which the access tests load.
      - run: npm ci
      - run: npm test

  links:
    name: External links (lychee)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check external URLs
        uses: lycheeverse/lychee-action@v2
        with:
          # --base-url makes lychee resolve root-relative links (/waitlist,
          #   /#engine, /logo-mark-512.png) against the production origin
          #   instead of erroring with "Cannot convert path to a URI" (lychee
          #   v0.23 treats unresolvable root-relative links in local files as
          #   errors — that failed every run until 2026-06-11). The resolved
          #   URLs then hit the growthkitai.com exclude below, so internal
          #   links stay the consistency job's responsibility.
          # --scheme http/https → external URLs only.
          # 999 = LinkedIn's bot-blocking status; 429 = rate limited. Neither
          #   means the link is dead.
          # growthkitai.com is excluded: internal links are validated by
          #   check-site.mjs, and canonicals/og:url for a page added in this
          #   same push would 404 until Vercel finishes deploying it.
          # fonts.gstatic.com is a preconnect origin — its root 404s by design.
          args: >-
            --no-progress
            --base-url 'https://growthkitai.com/'
            --scheme https
            --scheme http
            --accept '100..=103,200..=299,429,999'
            --max-retries 2
            --timeout 30
            --exclude 'https://growthkitai\.com'
            --exclude 'https://fonts\.gstatic\.com/?$'
            --exclude-path logo.html
            './*.html'
          fail: true
