<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>(function(){try{if(localStorage.getItem('gk-theme')==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}})();</script>
<link rel="icon" type="image/png" sizes="512x512" href="/logo-mark-512.png">
<link rel="icon" type="image/png" sizes="256x256" href="/logo-mark-256.png">
<link rel="icon" type="image/png" sizes="64x64" href="/logo-mark-64.png">
<link rel="apple-touch-icon" sizes="512x512" href="/logo-mark-512.png">
<title>Page not found — GrowthKit AI</title>
<meta name="description" content="The page you were looking for doesn't exist. Head back to GrowthKit AI or join the waitlist.">
<meta name="theme-color" content="#1F4732">
<meta name="robots" content="noindex, follow">
<link rel="manifest" href="/site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FAF8F4;
    --ink: #14130F;
    --ink-2: #2A2823;
    --muted: #6B6760;
    --line: #E2DDD3;
    --accent: #1F4732;
    --paper: #FFFFFF;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  main {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px;
  }
  .card {
    max-width: 560px;
    text-align: center;
  }
  .code {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 12px;
    color: var(--accent);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 22px;
  }
  h1 {
    font-family: 'Instrument Serif', serif;
    font-weight: 400;
    font-size: clamp(48px, 7vw, 80px);
    line-height: 1.05;
    letter-spacing: -0.025em;
    margin: 0 0 20px;
  }
  h1 em { font-style: italic; color: var(--accent); }
  p {
    color: var(--ink-2);
    font-size: 17px;
    max-width: 44ch;
    margin: 0 auto 36px;
  }
  .actions { display: inline-flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 11px 20px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 500;
    transition: background .2s ease, color .2s ease, border-color .2s ease;
  }
  .btn-primary { background: var(--ink); color: var(--bg); }
  .btn-primary:hover { background: var(--accent); }
  .btn-ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
  .arr { font-family: 'Instrument Serif', serif; font-style: italic; transform: translateY(-1px); }
</style>
<link rel="stylesheet" href="theme.css">
<script src="theme.js" defer></script>
</head>
<body class="has-dot-grid">
<main>
  <div class="card spotlight-card">
    <div class="spotlight" aria-hidden="true"></div>
    <div class="code">Error · 404</div>
    <h1>Page <em>not found</em>.</h1>
    <p>The page you were looking for has moved, been retired, or never existed. No harm done — try one of these instead.</p>
    <div class="actions">
      <a href="/" class="btn btn-primary magnetic">Back to home <span class="arr">→</span></a>
      <a href="/waitlist" class="btn btn-ghost">Join the waitlist</a>
    </div>
  </div>
</main>
</body>
</html>
